name = "mor-terminal"
main = "worker.js"
compatibility_date = "2026-07-01"

# worker.js lleva index.html dentro. Este paso lo regenera ANTES de cada
# despliegue, asi que es imposible subir la interfaz vieja por olvido: es
# justamente el error que provoco los acentos rotos en produccion.
[build]
command = "node sync.mjs"

[[kv_namespaces]]
binding = "RADAR"
id = "a82f8cbf53054956abf9804916e55b19"

# Asistente: Workers AI. Tambien hay que anadirlo en el panel
# (Settings -> Bindings -> Add -> Workers AI, nombre AI) si se despliega pegando.
[ai]
binding = "AI"

[triggers]
crons = ["0 7 * * *"]

# Variables no secretas. Las secretas (ADMIN_TOKEN, TELEGRAM_TOKEN) se ponen con
# `npx wrangler secret put NOMBRE` y NUNCA van en este archivo.
# [vars]
# EXIGIR_CLAVE = "1"
# TELEGRAM_CHAT = "..."
